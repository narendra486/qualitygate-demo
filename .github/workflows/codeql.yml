name: CodeQL Security Scan

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  security-events: read
  checks: write

jobs:
  codeql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results.sarif

      - name: Create QualityGate validation SARIF
        run: |
          mkdir -p sarif-results
          cat > sarif-results/minimal-comment.sarif <<'EOF'
          {
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "QualityGate Demo Scanner",
                    "rules": [
                      {
                        "id": "demo/high-risk-eval",
                        "name": "High risk dynamic evaluation",
                        "properties": {
                          "security-severity": "8.2"
                        }
                      }
                    ]
                  }
                },
                "results": [
                  {
                    "ruleId": "demo/high-risk-eval",
                    "ruleIndex": 0,
                    "level": "error",
                    "message": {
                      "text": "Synthetic high severity finding used to validate minimal PR comment content."
                    },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": {
                            "uri": "app.js"
                          },
                          "region": {
                            "startLine": 14
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF

      - name: Quality Gate
        uses: narendra486/qualitygate@enterprise-sarif-qualitygate
        with:
          sarif_file: |
            codeql-results.sarif
            sarif-results/minimal-comment.sarif
          severity_threshold: medium
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_comment: true
          enable_annotations: false
          deduplicate: true
